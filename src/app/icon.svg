<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Disco sólido con el anillo recortado dentro. PLANO a propósito.

    La versión anterior era el símbolo de la marca tal cual: un anillo en
    perspectiva con su canto en otro tono. Se veía bien a 32 píxeles y era un
    error de todas formas — un favicon no compite en detalle, compite en
    SILUETA. Dos tonos y un canto a 16 píxeles son ruido, no volumen.

    Aquí hay una sola forma maciza y un hueco. Es lo que hace que el triángulo
    de Vercel funcione: se reconoce por el contorno, no por lo que tiene dentro.

    El hueco es el anillo visto en perspectiva, que es lo único de la marca que
    sigue significando algo a este tamaño: dice «gráfica» sin decir «3D».

    Los colores se invierten con el tema del navegador. Un disco negro sólido
    desaparece contra la barra de pestañas en modo oscuro, y los SVG sí atienden
    a `prefers-color-scheme`.
  -->
  <style>
    .disco { fill: #14141a }
    .hueco { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .disco { fill: #f2f2f5 }
      .hueco { fill: #0d0d11 }
    }
  </style>

  <circle class="disco" cx="16" cy="16" r="16" />

  <!--
    Anillo elíptico, recortado. `evenodd` es lo que abre el agujero del centro:
    la elipse interior queda dentro de la exterior, así que la regla par-impar
    deja ese trozo sin pintar.

    Proporciones medidas a 16 píxeles, no elegidas por bonitas: con el anillo más
    fino el hueco se cerraba y quedaba un disco dentro de otro disco.
  -->
  <path
    class="hueco"
    fill-rule="evenodd"
    d="M26 16A10 6.2 0 1 1 6 16A10 6.2 0 1 1 26 16ZM20.2 16A4.2 2.6 0 1 0 11.8 16A4.2 2.6 0 1 0 20.2 16Z"
  />
</svg>
