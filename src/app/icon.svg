<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    El símbolo de la marca, en versión favicon.

    Es el mismo anillo en perspectiva del logotipo, pero SÓLIDO en vez de a
    trazo. El logotipo lo dibuja con `stroke-width` 3.6 sobre 24, que a 16
    píxeles —el tamaño real de una pestaña— se emborrona hasta convertirse en
    una mancha gris: el hueco del centro desaparece y deja de ser un anillo. Un
    favicon no es un logotipo pequeño, es otro dibujo con el mismo significado.

    El canto va primero y por tanto DETRÁS: es la misma forma desplazada hacia
    abajo, y al fundirse las dos siluetas en un solo color queda un anillo con
    cuerpo. Es lo que hace que a 16 píxeles siga leyéndose como un objeto y no
    como un aro plano — que es justo la tesis del producto.

    Y se adapta al tema del navegador. Un favicon negro sólido desaparece contra
    la barra de pestañas en modo oscuro; los SVG sí atienden a
    `prefers-color-scheme`, así que se aprovecha.
  -->
  <style>
    path { fill: #14141a }
    @media (prefers-color-scheme: dark) { path { fill: #f2f2f5 } }
  </style>

  <!-- El canto. Misma geometría, 3,4 más abajo. -->
  <path
    fill-rule="evenodd"
    d="M29.5 18.4A13.5 8.2 0 1 1 2.5 18.4A13.5 8.2 0 1 1 29.5 18.4ZM21.6 18.4A5.6 3.4 0 1 0 10.4 18.4A5.6 3.4 0 1 0 21.6 18.4Z"
    opacity="0.45"
  />

  <!-- La cara de arriba. -->
  <path
    fill-rule="evenodd"
    d="M29.5 15A13.5 8.2 0 1 1 2.5 15A13.5 8.2 0 1 1 29.5 15ZM21.6 15A5.6 3.4 0 1 0 10.4 15A5.6 3.4 0 1 0 21.6 15Z"
  />
</svg>
